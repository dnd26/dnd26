<svg width="1200" height="120" viewBox="0 0 1200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trackBg" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <linearGradient id="groundGlow" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.1" />
    </linearGradient>

    <clipPath id="stageClip">
      <rect width="1200" height="120" rx="14" />
    </clipPath>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      /* Robot chạy ngang màn hình */
      .robot-run {
        animation: runAcross 9s linear infinite;
      }

      /* Robot nhảy đúng nhịp qua 3 chướng ngại vật ở 25%, 50%, 75% */
      .robot-jump {
        animation: jumpOver 9s linear infinite;
      }

      /* Chân robot chạy lạch bạch */
      .leg-left {
        transform-origin: 18px 50px;
        animation: legSwing 0.35s ease-in-out infinite alternate;
      }
      .leg-right {
        transform-origin: 30px 50px;
        animation: legSwing 0.35s ease-in-out infinite alternate-reverse;
      }

      /* Đèn ăng-ten nhấp nháy */
      .antenna-glow {
        animation: blink 1s ease-in-out infinite;
      }

      /* Đường chạy lướt ngược tạo cảm giác tốc độ */
      .speed-line {
        stroke-dasharray: 12 18;
        animation: groundScroll 1.2s linear infinite;
      }

      @keyframes runAcross {
        0%   { transform: translateX(-60px); }
        100% { transform: translateX(1260px); }
      }

      @keyframes jumpOver {
        0%, 19%   { transform: translateY(0px); }
        10%       { transform: translateY(-4px); }
        /* Nhảy qua khối 1 (x=270) */
        21%       { transform: translateY(0px); }
        25%       { transform: translateY(-42px); }
        29%       { transform: translateY(0px); }
        /* Nhảy nhịp nhỏ */
        37%       { transform: translateY(-4px); }
        /* Nhảy qua khối 2 (x=600) */
        46%       { transform: translateY(0px); }
        50%       { transform: translateY(-42px); }
        54%       { transform: translateY(0px); }
        /* Nhảy nhịp nhỏ */
        62%       { transform: translateY(-4px); }
        /* Nhảy qua khối 3 (x=930) */
        71%       { transform: translateY(0px); }
        75%       { transform: translateY(-42px); }
        79%       { transform: translateY(0px); }
        88%       { transform: translateY(-4px); }
        100%      { transform: translateY(0px); }
      }

      @keyframes legSwing {
        0%   { transform: rotate(-22deg); }
        100% { transform: rotate(22deg); }
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.3; }
      }

      @keyframes groundScroll {
        to { stroke-dashoffset: 30; }
      }
    </style>
  </defs>

  <g clip-path="url(#stageClip)">
    
    <rect width="1200" height="120" rx="14" fill="url(#trackBg)" />
    <rect x="0.75" y="0.75" width="1198.5" height="118.5" rx="13.25" stroke="#1E293B" stroke-width="1.5" />

    
    <text x="24" y="28" fill="#334155" font-size="11" font-weight="600" letter-spacing="1.2" class="font-mono">AI AGENT RUNTIME // LOOPING...</text>

    
    <line x1="0" y1="98" x2="1200" y2="98" stroke="url(#groundGlow)" stroke-width="2" />
    <line x1="0" y1="106" x2="1200" y2="106" stroke="#1E293B" stroke-width="1.5" class="speed-line" />

    
    <g transform="translate(274, 72)">
      <rect width="38" height="26" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.4" />
      <text x="19" y="17" text-anchor="middle" fill="#38BDF8" font-size="10" font-weight="700" class="font-mono">API</text>
    </g>

    
    <g transform="translate(604, 72)">
      <rect width="38" height="26" rx="6" fill="#1E1B4B" stroke="#A78BFA" stroke-width="1.4" />
      <text x="19" y="17" text-anchor="middle" fill="#C4B5FD" font-size="10" font-weight="700" class="font-mono">LLM</text>
    </g>

    
    <g transform="translate(934, 72)">
      <rect width="38" height="26" rx="6" fill="#064E3B" stroke="#34D399" stroke-width="1.4" />
      <text x="19" y="17" text-anchor="middle" fill="#6EE7B7" font-size="10" font-weight="700" class="font-mono">n8n</text>
    </g>

    
    <g class="robot-run">
      <g class="robot-jump">
        
        <g transform="translate(0, 36)">
          
          <line x1="24" y1="10" x2="24" y2="3" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
          <circle cx="24" cy="2" r="3.2" fill="#34D399" class="antenna-glow" />

          
          <rect x="8" y="10" width="32" height="22" rx="7" fill="#1E293B" stroke="#38BDF8" stroke-width="1.6" />
          
          <rect x="12" y="14" width="24" height="14" rx="4" fill="#090E1A" />
          
          <circle cx="19" cy="21" r="2.6" fill="#38BDF8" />
          <circle cx="29" cy="21" r="2.6" fill="#38BDF8" />

          
          <rect x="12" y="34" width="24" height="17" rx="5" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" />
          
          <circle cx="24" cy="42.5" r="3.5" fill="#A78BFA" class="antenna-glow" />

          
          <line x1="10" y1="39" x2="4" y2="45" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
          <line x1="38" y1="39" x2="44" y2="34" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />

          
          <line x1="18" y1="51" x2="16" y2="61" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" class="leg-left" />
          <line x1="30" y1="51" x2="32" y2="61" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" class="leg-right" />
        </g>
      </g>
    </g>
  </g>
</svg>
