<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D1A" />
    </linearGradient>

    <linearGradient id="ropeGrad" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      /* Animation cho cả nhóm kéo (chạy lùi và tiến nhẹ) */
      .straining-motion {
        animation: tugOfWar 1.8s ease-in-out infinite alternate;
      }

      /* Robot nỗ lực kéo (vung chân, mệt nhọc nghiêng người) */
      .robot-pull {
        animation: robotStruggle 0.4s ease-in-out infinite alternate;
        transform-origin: 480px 140px;
      }
      .robot-leg1 {
        transform-origin: 475px 155px;
        animation: legKick 0.25s ease-in-out infinite alternate;
      }
      .robot-leg2 {
        transform-origin: 495px 155px;
        animation: legKick 0.25s ease-in-out infinite alternate-reverse;
      }
      .sweat-drop {
        animation: sweatFly 0.8s ease-in infinite;
      }

      /* Người bị kéo (Dat) - hơi loạng choạng, chân bước, tay giữ dây */
      .human-drag {
        animation: humanStumble 0.6s ease-in-out infinite alternate;
        transform-origin: 680px 130px;
      }
      .human-leg1 {
        transform-origin: 670px 155px;
        animation: humanLeg 0.3s ease-in-out infinite alternate;
      }
      .human-leg2 {
        transform-origin: 690px 155px;
        animation: humanLeg 0.3s ease-in-out infinite alternate-reverse;
      }

      /* Dây cáp năng lượng co giãn &amp; rung giật */
      .energy-rope {
        animation: ropeVibrate 0.15s linear infinite;
      }

      /* Các khối Tech chạy lướt qua dưới chân */
      .scrolling-ground {
        stroke-dasharray: 20 40;
        animation: moveGround 1.2s linear infinite;
      }

      /* Hiệu ứng tia lửa năng lượng dưới chân robot */
      .spark {
        animation: sparkFlicker 0.3s linear infinite;
      }

      @keyframes tugOfWar {
        0% { transform: translateX(-15px); }
        100% { transform: translateX(15px); }
      }

      @keyframes robotStruggle {
        0% { transform: rotate(-5deg) translateY(0px); }
        100% { transform: rotate(-12deg) translateY(2px); }
      }

      @keyframes legKick {
        0% { transform: rotate(-15deg); }
        100% { transform: rotate(25deg); }
      }

      @keyframes humanStumble {
        0% { transform: rotate(4deg) translateY(0px); }
        100% { transform: rotate(-3deg) translateY(-3px); }
      }

      @keyframes humanLeg {
        0% { transform: rotate(-12deg); }
        100% { transform: rotate(18deg); }
      }

      @keyframes sweatFly {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(-25px, 20px) scale(0.3); opacity: 0; }
      }

      @keyframes ropeVibrate {
        0% { stroke-width: 3.5; }
        50% { stroke-width: 4.5; }
        100% { stroke-width: 3.5; }
      }

      @keyframes moveGround {
        to { stroke-dashoffset: 60; }
      }

      @keyframes sparkFlicker {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  
  <rect width="1200" height="240" rx="14" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="1198.5" height="238.5" rx="13.25" stroke="#1E293B" stroke-width="1.5" />

  
  <line x1="100" y1="180" x2="1100" y2="180" stroke="#1E293B" stroke-width="1.5" />
  <line x1="100" y1="184" x2="1100" y2="184" stroke="url(#ropeGrad)" stroke-width="2" class="scrolling-ground" />
  
  <text x="50" y="38" fill="#475569" font-size="11" font-weight="600" letter-spacing="1.2" class="font-mono">CRITICAL TASK OVERLOAD // AI AGENT PULLING OPERATION</text>
  <text x="1150" y="38" text-anchor="end" fill="#F43F5E" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">PULLING DAT TO PRODUCTION • 100% EFFORT</text>

  
  <g class="straining-motion" transform="translate(60, 0)">
    
    
    <g class="spark" transform="translate(460, 180)">
      <path d="M-10,0 L0,-12 L5,-2 M12,-3 L25,0 M-5,5 L-18,-4" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
      <path d="M5,0 L18,-8 M-22,-2 L-8,3" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" />
    </g>

    
    <path d="M 495 132 Q 585 122 662 128" stroke="url(#ropeGrad)" stroke-width="4" stroke-linecap="round" fill="none" class="energy-rope" />
    
    <circle cx="530" cy="126" r="3" fill="#FFF" opacity="0.8" />
    <circle cx="580" cy="124" r="3" fill="#FFF" opacity="0.8" />
    <circle cx="630" cy="126" r="3" fill="#FFF" opacity="0.8" />

    
    <g class="robot-pull">
      
      <line x1="480" y1="78" x2="480" y2="68" stroke="#94A3B8" stroke-width="2" />
      <circle cx="480" cy="66" r="4" fill="#34D399" />
      
      
      <circle cx="455" cy="85" r="2.5" fill="#38BDF8" class="sweat-drop" />
      <circle cx="452" cy="100" r="2" fill="#38BDF8" class="sweat-drop" style="animation-delay: 0.3s;" />
      
      
      <rect x="458" y="76" width="44" height="32" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
      
      <rect x="464" y="82" width="32" height="20" rx="5" fill="#090E1A" />
      
      <path d="M 470 90 L 477 94 L 470 98" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 490 90 L 483 94 L 490 98" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      
      
      <rect x="464" y="112" width="32" height="26" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1.8" />
      
      <circle cx="480" cy="125" r="4.5" fill="#F43F5E" />
      
      
      <path d="M 490 122 L 502 131 L 495 135" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      
      
      <line x1="472" y1="138" x2="464" y2="164" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" class="robot-leg1" />
      <line x1="488" y1="138" x2="480" y2="164" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" class="robot-leg2" />
    </g>

    
    <g class="human-drag">
      
      <rect x="712" y="112" width="22" height="15" rx="3" fill="#334155" stroke="#94A3B8" stroke-width="1.2" transform="rotate(-15 712 112)" />
      <path d="M 724 105 L 738 98 M 715 95 L 726 90" stroke="#E2E8F0" stroke-width="1.5" />

      
      <circle cx="682" cy="74" r="16" fill="#FDBA74" />
      
      <path d="M 666 70 C 666 56, 698 56, 698 70 C 692 64, 672 64, 666 70 Z" fill="#1E293B" />
      
      <rect x="670" y="71" width="10" height="7" rx="1.5" fill="none" stroke="#0F172A" stroke-width="1.5" />
      <rect x="683" y="71" width="10" height="7" rx="1.5" fill="none" stroke="#0F172A" stroke-width="1.5" />
      <line x1="680" y1="74" x2="683" y2="74" stroke="#0F172A" stroke-width="1.5" />
      
      <path d="M 674 81 Q 682 87 686 81" stroke="#0F172A" stroke-width="1.8" fill="none" />

      
      <path d="M 666 90 L 696 90 L 692 135 L 668 135 Z" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5" />
      
      <line x1="668" y1="92" x2="692" y2="128" stroke="#78350F" stroke-width="3" />

      
      <path d="M 668 114 L 662 128" stroke="#FDBA74" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 688 110 L 702 118" stroke="#FDBA74" stroke-width="3.5" stroke-linecap="round" />

      
      <line x1="673" y1="135" x2="665" y2="168" stroke="#1E293B" stroke-width="5" stroke-linecap="round" class="human-leg1" />
      <line x1="687" y1="135" x2="695" y2="168" stroke="#1E293B" stroke-width="5" stroke-linecap="round" class="human-leg2" />
    </g>

    
    <g transform="translate(490, 20)">
      <rect width="180" height="32" rx="8" fill="#0F172A" stroke="#34D399" stroke-width="1.2" />
      <polygon points="25,32 32,38 35,32" fill="#0F172A" stroke="#34D399" stroke-width="1.2" />
      <text x="90" y="20" text-anchor="middle" fill="#6EE7B7" font-size="10.5" font-weight="700" class="font-sans">🤖 PUSHING TO PRODUCTION! RUN!</text>
    </g>

    <g transform="translate(690, 25)">
      <rect width="160" height="32" rx="8" fill="#0F172A" stroke="#A78BFA" stroke-width="1.2" />
      <polygon points="15,32 8,38 10,32" fill="#0F172A" stroke="#A78BFA" stroke-width="1.2" />
      <text x="80" y="20" text-anchor="middle" fill="#C4B5FD" font-size="10.5" font-weight="700" class="font-sans">🏃‍♂️ WAIT, MY CODE IS RUNNING!</text>
    </g>
  </g>
</svg>
