  <circle cx="930" cy="219" r="3.5" fill="#94A3B8" />
  <text x="942" y="223" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="0.8" class="font-mono">04 · APPS &amp; DATA</text>
