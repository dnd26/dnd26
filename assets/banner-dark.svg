  <text x="930" y="131" fill="#FFFFFF" font-size="13.5" font-weight="700" class="font-sans">Gemini API · LLM · OCR</text>

  
  <path d="M 1020 150 L 1020 174 L 748 174 L 748 190" stroke="#A78BFA" stroke-width="1.8" fill="none" class="flow-line" marker-end="url(#arrowPurple)" />

  
