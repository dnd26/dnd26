  <rect x="642" y="82" width="212" height="68" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.2" />
  <circle cx="658" cy="103" r="3.5" fill="#38BDF8" />
  <text x="670" y="107" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="0.8" class="font-mono">01 · TRIGGER / INPUT</text>
